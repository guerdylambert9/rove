# Deploy preview builds to Vercel on push to main (and PRs).
# Required GitHub secrets (Flex Vercel account):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID     (team_W9vKgMZTQ6fAeJJdWPtWD0Cf)
#   VERCEL_PROJECT_ID (prj_LjjS3qxT519ZQ2rabUR2Aj7Gn1gF)
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Optional: VITE_STRIPE_PUBLISHABLE_KEY, VITE_BYPASS_INSURANCE, STAGING_ALIAS
#
# No Vercel↔GitHub connection required. On every main push (or workflow_dispatch),
# this job builds, deploys with the CLI token, then aliases rove-staging.vercel.app.
# That alias step is what keeps the stable staging URL current.

name: Deploy staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Write Vite env after vercel pull so pull cannot overwrite these values.
      # Validate URL shape without printing secret values (avoids blank staging).
      - name: Write Vite production env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_BYPASS_INSURANCE: ${{ secrets.VITE_BYPASS_INSURANCE }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in GitHub Actions secrets."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*|http://*) ;;
            *)
              echo "VITE_SUPABASE_URL must start with http:// or https:// (check for quotes/spaces in the secret)."
              echo "URL length: ${#VITE_SUPABASE_URL}"
              exit 1
              ;;
          esac
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_STRIPE_PUBLISHABLE_KEY=$VITE_STRIPE_PUBLISHABLE_KEY"
            echo "VITE_BYPASS_INSURANCE=$VITE_BYPASS_INSURANCE"
          } > .env.production
          echo "Wrote .env.production (URL length ${#VITE_SUPABASE_URL}, key length ${#VITE_SUPABASE_ANON_KEY})"

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_BYPASS_INSURANCE: ${{ secrets.VITE_BYPASS_INSURANCE }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Runs on main push and manual workflow_dispatch (not PRs).
      - name: Alias staging
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          alias="${STAGING_ALIAS:-rove-staging.vercel.app}"
          url="${{ steps.deploy.outputs.url }}"
          echo "Aliasing $url → $alias"
          vercel alias set "$url" "$alias" --token=${{ secrets.VERCEL_TOKEN }} --scope flex26
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_ALIAS: ${{ secrets.STAGING_ALIAS }}
